# Sponsor list, source of truth for both the homepage carousel and the
# /sponsors/ page. Run `python tools/update_sponsors.py` after editing to
# regenerate templates/homepage.html and templates/sponsors.html.
#
# key:    url-friendly identifier (also the local avatar filename)
# name:   display name
# url:    sponsor website (falls back to the GitHub profile)
# github: GitHub profile URL (used for avatar refresh, data lookup, etc.)
# avatar: image URL to download
# style:  round (default) | square - square for org/product logos
# tier:   gold | silver | bronze | backer  (drives the display size on the
#         sponsors page; gold/silver/bronze show a logo, backer shows the name)
# past:   true for former sponsors - shown on the sponsors page (merged in as a
#         thank-you) but kept out of the homepage carousel

